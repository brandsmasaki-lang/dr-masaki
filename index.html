<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
  body{font-size:14px}

<title>Dr.MASAKI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
  /* 1画面ゲーム：論理サイズ360x600の舞台を画面に合わせて拡大縮小。上に操作パネルとメニューを重ねる */
  :root{
    --bg:#0c0e1e; --panel:#161a36; --line:#2d3366; --text:#eef0ff; --sub:#9da3d6;
    --accent:#7cf2c8; --warn:#ff8fa3;
    --font-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
    --font-body:"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  *{-webkit-tap-highlight-color:transparent}
  /* ホスティング側が自動で差し込む表示（このゲームはiframeを使わない）を隠す */
  html>iframe,body>iframe{display:none!important}
  #stage,#pad,#pad *{touch-action:none}
  #rec{touch-action:pan-y}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);margin:0;display:flex;flex-direction:column;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:8px;box-sizing:border-box;overflow:hidden;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;touch-action:manipulation}
  #shell{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center}
  #stage{position:relative;overflow:hidden}
  #world{position:absolute;left:0;top:0;width:360px;height:600px;transform-origin:0 0}
  #cv{position:absolute;inset:0;width:360px;height:100%;display:block}

  .ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);text-align:center;padding:20px}
  .ov h2{margin:0;font:28px/1.2 var(--font-display);color:var(--accent);text-wrap:balance}
  .ov p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
  .logo{font:44px/1 var(--font-display);color:var(--accent);letter-spacing:.04em;text-shadow:3px 3px 0 #2b3a8a}
  .lbl{font:11px var(--font-display);color:var(--sub);letter-spacing:.14em}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  button{font:15px var(--font-display);color:var(--text);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.sel{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  button.big{font-size:20px;padding:10px 30px;background:var(--accent);color:var(--bg);border-color:var(--accent)}
  input[type=range]{width:220px;height:36px;accent-color:var(--accent);touch-action:pan-x}
  input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
  input,#lvn{touch-action:manipulation}
  .lvnum{font:24px var(--font-display);width:72px;height:44px;box-sizing:border-box;text-align:center;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;-moz-appearance:textfield}
  .lvnum::-webkit-inner-spin-button,.lvnum::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .lvnum:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.step{width:44px;height:44px;padding:0;font-size:24px;line-height:1}
  button.step.wide{width:auto;padding:0 16px;font-size:15px}
  .topRec{font-size:12px;color:var(--sub)}
  .ov button{touch-action:manipulation} /* すばやく続けて押してもズームに取られないように */
  #menu,#settings{background:color-mix(in srgb,var(--bg) 97%,transparent);gap:18px}
  #menu .logo{margin-bottom:6px}
  #startBtn{font-size:24px;padding:14px 56px;margin-top:6px}
  button.sub2{min-width:110px}
  .setList{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
  .setRow{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .setName{font:13px var(--font-display);color:var(--sub);text-align:left}
  .seg{flex-wrap:nowrap;gap:6px}.seg button{flex:1;padding-left:4px;padding-right:4px}
  .topRec b{font:13px var(--font-display);font-variant-numeric:tabular-nums;color:var(--text)}
  .keys{font-size:11px;color:var(--sub);line-height:1.7}

  /* 記録画面 */
  #rec{justify-content:flex-start;align-items:stretch;text-align:left;overflow-y:auto;background:var(--bg);gap:14px}
  #rec h2{text-align:center}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font:18px var(--font-display);font-variant-numeric:tabular-nums}
  .sec{font:14px var(--font-display);color:var(--accent);margin-top:4px}
  table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
  th,td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--sub);font-weight:normal}
  td.ok{color:var(--accent)} td.no{color:var(--line)}
  .ach{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
  .ach .m{font:16px var(--font-display);width:20px;flex:none;text-align:center}
  .ach.lock{opacity:.4}
  .ach small{display:block;color:var(--sub)}
  .hist{font-size:12px;display:grid;grid-template-columns:auto auto auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
  .hist span:nth-child(4n){text-align:right}
  .cloud{font-size:11px;color:var(--sub);text-align:center}
  .recfoot{position:sticky;bottom:-20px;background:var(--bg);padding:10px 0;display:flex;justify-content:center}

  /* スマホ操作パネル：画面のいちばん下に固定し、盤面の下の方に重ねる。--s はゲーム画面の拡大率 */
  #pad{position:fixed;left:0;right:0;top:0;height:100vh;height:100lvh;pointer-events:none;z-index:5;--u:var(--pu,1px)}
  #pad[hidden]{display:none!important}
  /* #dpad は指が当たる範囲（見た目より一回り広い）。中の #cross が見える十字キー */
  #dpad{position:absolute;left:calc(max(4px,env(safe-area-inset-left,0px)) - var(--u) * 28);bottom:calc(env(safe-area-inset-bottom,0px) + 4px - var(--u) * 28);
    width:calc(var(--u) * 252);height:calc(var(--u) * 252);pointer-events:auto;touch-action:none}
  #cross{position:absolute;left:calc(var(--u) * 28);top:calc(var(--u) * 28);width:calc(var(--u) * 196);height:calc(var(--u) * 196)}
  #dpad i{position:absolute;width:33.34%;height:33.34%;box-sizing:border-box;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-style:normal;font-size:calc(var(--u) * 24)}
  #dpad i.on{background:rgba(124,242,200,.42)}
  #dpad .u{left:33.33%;top:0;border-radius:8px 8px 0 0;opacity:.35}
  #dpad .l{left:0;top:33.33%;border-radius:8px 0 0 8px}
  #dpad .r{left:66.66%;top:33.33%;border-radius:0 8px 8px 0}
  #dpad .d{left:33.33%;top:66.66%;border-radius:0 0 8px 8px}
  #dpad .c{left:33.33%;top:33.33%;border:none;background:rgba(255,255,255,.12)}
  #rot{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 6px + var(--u) * 20);
    width:calc(var(--u) * 80);height:calc(var(--u) * 80);border-radius:50%;pointer-events:auto;touch-action:none;
    background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--u) * 34)}
  #rot.on{background:rgba(124,242,200,.45)}
  /* ♪ と II はゲーム画面の中、LIFE の下（ゲームの座標で置く） */
  .gbtn{position:absolute;top:376px;width:44px;height:36px;padding:0;font-size:17px;border-radius:10px;touch-action:none;z-index:2}
  #musicBtn{left:258px}#pauseBtn{left:306px}
  #musicBtn.off{opacity:.45;text-decoration:line-through}

  #msgImg{width:210px;height:auto;max-width:100%;transform-origin:50% 90%;animation:plop .7s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes plop{0%{transform:translateY(-60px) rotate(-12deg) scale(.6);opacity:0}60%{transform:translateY(6px) rotate(4deg) scale(1.04);opacity:1}100%{transform:none}}
  @media (prefers-reduced-motion:reduce){#msgImg{animation:none}}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:var(--bg);
    font:13px var(--font-display);padding:8px 14px;border-radius:8px;white-space:nowrap;pointer-events:none;
    transition:opacity .3s;opacity:0}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="shell">
  <div id="stage">
    <div id="world">
      <canvas id="cv"></canvas>
      <button id="musicBtn" class="gbtn" aria-label="音楽のオン・オフ">♪</button>
      <button id="pauseBtn" class="gbtn" aria-label="一時停止">II</button>

      <div id="pad" hidden>
        <div id="dpad"><div id="cross"><i class="u">▲</i><i class="l">◀</i><i class="c"></i><i class="r">▶</i><i class="d">▼</i></div></div>
        <div id="rot" aria-label="回転">⟳</div>
      </div>

      <div class="ov" id="menu">
        <div class="logo">Dr.MASAKI</div>
        <div>
          <div class="lbl">レベル</div>
          <div class="row"><button class="step" id="lvDown" aria-label="レベルを下げる">−</button><input class="lvnum" id="lvn" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="30" value="0" aria-label="レベルの数字"><button class="step" id="lvUp" aria-label="レベルを上げる">＋</button></div>
        </div>
        <div>
          <div class="lbl">スピード</div>
          <div class="row" id="spd"><button data-s="0" class="sel">LOW</button><button data-s="1">MED</button><button data-s="2">HI</button></div>
        </div>
        <button class="big" id="startBtn">スタート</button>
        <div class="row"><button class="sub2" id="recBtn">記録</button><button class="sub2" id="setBtn">設定</button></div>
        <div class="topRec">ベスト <b id="topBest">0</b>　／　最長連続 <b id="topLong">0:00</b></div>
      </div>

      <div class="ov" id="settings" hidden>
        <h2>設定</h2>
        <div class="setList">
          <div class="setRow"><div class="setName">音楽</div><div class="row seg" id="bgmSel"><button data-b="0">オフ</button><button data-b="1">ノリノリ</button><button data-b="2">まったり</button></div></div>
          <div class="setRow"><div class="setName">効果音</div><div class="row seg" id="seSel"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
          <div class="setRow"><div class="setName">画面ボタン</div><div class="row seg" id="padSel"><button data-p="auto">自動</button><button data-p="on">いつも</button><button data-p="off">なし</button></div></div>
          <div class="setRow"><div class="setName">画面ボタンの高さ</div><div class="row seg"><button id="padUp" aria-label="画面ボタンを上へ">▲ 上へ</button><button id="padDown" aria-label="画面ボタンを下へ">▼ 下へ</button></div></div>
        </div>
        <p class="keys">キーボード：←→ 移動　↓ 落とす　Z・X・↑・スペース 回転<br>P 一時停止　M 音楽オン・オフ</p>
        <button class="big" id="setClose">もどる</button>
      </div>

<script>
(() => {
/* ================= 基本設定 ================= */
const LW = 360; let LH = 600;
const W = 8, H = 16, BY = 136; let CS = 28, BX = 14; // CS（ますの大きさ）とBXは画面に合わせて fit() で決める
const COLORS = [
  { main:'#ff4f6e', dark:'#9e1534', light:'#ffc0cc', name:'赤' },
  { main:'#ffd447', dark:'#a07a00', light:'#fff1b8', name:'黄' },
  { main:'#43a8ff', dark:'#0f4f9c', light:'#c4e4ff', name:'青' },
];
const SPEED_NAMES = ['LOW','MED','HI'];
const SPEED_START = [15, 25, 31];
const SPEED_MULT = [1, 2, 3];
const FALL = [];
for (let i = 0; i < 26; i++) FALL.push(69 - 2 * i);
for (let f = 18; f >= 10; f--) FALL.push(f);
[9,9,8,8,7,7,6,6].forEach(f => FALL.push(f));
for (let i = 0; i < 13; i++) FALL.push(5);
for (const f of [4,3,2]) for (let i = 0; i < 5; i++) FALL.push(f);
while (FALL.length < 81) FALL.push(1);
const THROW = 26;
// カプセルを持つ手の位置は、いま表示しているドクターの絵から計算する（hand(pose)）
const SPAWN_C = [BX + 4 * CS, BY + CS / 2];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const stage = $('stage'), world = $('world');

let grid, cur = null, next = null, flying = null;
let state = 'title', prevState = null;
let level = 0, speedSel = 0, speedIdx = 0, pills = 0, score = 0;
let chainV = 0, timer = 0, dropT = 0, frame = 0, throwPose = 0;
let run = null, runStartMs = 0;
const held = {}, holdT = {}, queue = [];

try {
  const p = JSON.parse(localStorage.getItem('drMasakiPrefs') || '{}');
  if (p.level >= 0 && p.level <= 30) level = p.level;
} catch (e) {}

/* ================= 盤面ロジック ================= */
const emptyGrid = () => Array.from({ length: H }, () => Array(W).fill(null));
function free(x, y) {
  if (x < 0 || x >= W || y >= H) return false;
  if (y < 0) return true;
  return !grid[y][x];
}
function cellsOf(p) {
  return p.o === 'h'
    ? [[p.x, p.y, p.c[0]], [p.x + 1, p.y, p.c[1]]]
    : [[p.x, p.y, p.c[0]], [p.x, p.y - 1, p.c[1]]];
}
const fits = p => cellsOf(p).every(([x, y]) => free(x, y));
const rndPill = () => [Math.floor(Math.random() * 3), Math.floor(Math.random() * 3)];
function virusCount(col) {
  let n = 0;
  for (const r of grid) for (const c of r) if (c && c.t === 'v' && (col === undefined || c.c === col)) n++;
  return n;
}

// ウイルスの数は「3＋レベル×2」。選べるのは30までだが、クリアすると60まで上がっていく。
// ビンに入る数には限りがあるので96匹で頭打ち（レベル47以降）
const MAX_LEVEL = 60, PICK_MAX = 30, MAX_VIRUS = 96;
const virusTotal = lv => Math.min(3 + 2 * lv, MAX_VIRUS);
function placeViruses(lv) {
  const total = virusTotal(lv);
  const topRow = lv <= 20 ? 6 : lv <= 24 ? 5 : lv <= 27 ? 4 : 3;
  const colorAt = (x, y) => (x >= 0 && x < W && y >= 0 && y < H && grid[y][x]) ? grid[y][x].c : -1;
  // 縦横とも、2マス先まで同じ色が並ばないようにする
  const ok = (x, y, c) => {
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]])
      if (colorAt(x + dx, y + dy) === c || colorAt(x + 2*dx, y + 2*dy) === c) return false;
    return true;
  };
  const cells = [];
  for (let y = topRow; y < H; y++) for (let x = 0; x < W; x++) cells.push([x, y]);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // 1) ふつうに1匹ずつランダムに置く
  grid = emptyGrid();
  let placed = 0;
  for (const [x, y] of shuffle(cells.slice())) {
    if (placed >= total) break;
    const s = placed % 3; // 3色がだいたい同じ数になるように
    for (let k = 0; k < 3; k++) { const c = (s + k) % 3; if (ok(x, y, c)) { grid[y][x] = { c, t: 'v' }; placed++; break; } }
  }
  if (placed >= total) return;

  // 2) 数が多くて置ききれないとき：きれいに並ぶ色の模様で置いてから、ランダムに動かして崩す
  grid = emptyGrid();
  const k = Math.random() < .5 ? 1 : 2, o = Math.floor(Math.random() * 3), flip = Math.random() < .5, perm = shuffle([0, 1, 2]);
  for (const [x, y] of shuffle(cells.slice()).slice(0, total)) {
    const xx = flip ? W - 1 - x : x;
    grid[y][x] = { c: perm[(xx + k * y + o) % 3], t: 'v' };
  }
  for (let it = 0; it < 20000; it++) {
    const [x, y] = cells[Math.floor(Math.random() * cells.length)];
    const v = grid[y][x]; if (!v) continue;
    const [nx, ny] = cells[Math.floor(Math.random() * cells.length)];
    if (grid[ny][nx]) continue;
    grid[y][x] = null;
    const s = Math.floor(Math.random() * 3); let moved = false;
    for (let j = 0; j < 3 && !moved; j++) { const c = (s + j) % 3; if (ok(nx, ny, c)) { grid[ny][nx] = { c, t: 'v' }; moved = true; } }
    if (!moved) grid[y][x] = v;
  }
}

function startLevel() {
  grid = emptyGrid();
  placeViruses(level);
  pills = 0;
  stageFrames = 0;
  // ウイルスが頭打ちになるレベル47からは、1レベルごとに最初の落ちる速さを2段階ずつ上げる
  speedIdx = Math.min(SPEED_START[speedSel] + Math.max(0, level - 46) * 2, FALL.length - 1);
  if (!next) next = rndPill();
  throwNext();
}

// ドクターが次のカプセルを投げる
function throwNext() {
  flying = next; next = null; cur = null;
  state = 'throw'; timer = 0; throwPose = 1;
}
function landThrow() {
  cur = { x: 3, y: 0, o: 'h', c: flying };
  flying = null; next = rndPill(); dropT = 0;
  if (!fits(cur)) { topOut(); return; }
  state = 'play';
}

function tryMove(dx, dy) {
  const p = { ...cur, x: cur.x + dx, y: cur.y + dy };
  if (fits(p)) { cur = p; return true; }
  return false;
}
// 回転（時計回り）。左下のマスを軸に回る。横にするとき右がふさがっていたら左へずらす
function rotateLeft() {
  const p = { ...cur, c: [...cur.c] };
  if (p.o === 'h') { p.o = 'v'; p.c.reverse(); }
  else p.o = 'h';
  if (fits(p)) { cur = p; return; }
  if (p.o === 'h') { const q = { ...p, x: p.x - 1 }; if (fits(q)) cur = q; }
}

function lock() {
  const cs = cellsOf(cur);
  cs.forEach(([x, y, c]) => { if (y >= 0) grid[y][x] = { c, t: 'p', l: null }; });
  const [a, b] = cs;
  if (a[1] >= 0 && b[1] >= 0) {
    if (cur.o === 'h') { grid[a[1]][a[0]].l = 'R'; grid[b[1]][b[0]].l = 'L'; }
    else { grid[a[1]][a[0]].l = 'U'; grid[b[1]][b[0]].l = 'D'; }
  }
  cur = null;
  pills++; if (run) run.pc++;
  if (pills % 10 === 0) speedIdx = Math.min(speedIdx + 1, FALL.length - 1);
  chainV = 0; chainStep = 0;
  resolve();
}

function findMatches() {
  const m = new Set();
  const scan = (get, lenA, lenB, key) => {
    for (let a = 0; a < lenA; a++) {
      let run = 1;
      for (let b = 1; b <= lenB; b++) {
        const p = b < lenB ? get(a, b) : null, q = get(a, b - 1);
        if (p && q && p.c === q.c) run++;
        else {
          if (q && run >= 4) for (let k = b - run; k < b; k++) m.add(key(a, k));
          run = 1;
        }
      }
    }
  };
  scan((y, x) => grid[y][x], H, W, (y, x) => y * W + x);
  scan((x, y) => grid[y][x], W, H, (x, y) => y * W + x);
  return [...m].map(i => [i % W, Math.floor(i / W)]);
}
const partnerPos = (x, y, l) =>
  l === 'R' ? [x + 1, y] : l === 'L' ? [x - 1, y] : l === 'U' ? [x, y - 1] : [x, y + 1];

// 連鎖：1つのカプセルを置いたあと、消える→落ちる→また消える、を何回続けたか
// 連鎖ボーナス（点）：2連鎖で+100、3連鎖でさらに+200、4連鎖でさらに+300…と1連鎖ごとに上乗せが100点ずつ増える
//   合計は 2連鎖 100 / 3連鎖 300 / 4連鎖 600 / 5連鎖 1000 / 6連鎖 1500 / 7連鎖 2100 …
// 残機：4〜6連鎖で+1、7連鎖以上で+2
let chainStep = 0;
const chainPoints = n => n < 2 ? 0 : 100 * (n - 1) * n / 2;
function chainBonus() {
  if (chainStep < 2) return;
  const pts = chainPoints(chainStep);
  const up = chainStep >= 7 ? 2 : chainStep >= 4 ? 1 : 0;
  score += pts; lives += up;
  if (run) { run.sc = score; run.rc = Math.max(run.rc || 0, chainStep); run.up = (run.up || 0) + up; }
  toastQ.push(`${chainStep}連鎖！ +${pts.toLocaleString()}点` + (up ? `　残機+${up}` : ''));
  if (!toastTimer) nextToast();
}
function resolve() {
  const m = findMatches();
  if (m.length) {
    chainStep++;
    let v = 0;
    for (const [x, y] of m) {
      const c = grid[y][x];
      if (c.t === 'p' && c.l) {
        const [px, py] = partnerPos(x, y, c.l);
        const pc = grid[py] && grid[py][px];
        if (pc && pc.t === 'p') pc.l = null;
      }
      if (c.t === 'v') v++;
    }
    for (const [x, y] of m) grid[y][x] = { c: grid[y][x].c, t: 'x' };
    for (let i = 0; i < v; i++) {
      chainV++;
      score += [100, 200, 400, 800, 1600, 3200][Math.min(chainV - 1, 5)] * SPEED_MULT[speedSel];
    }
    if (run) { run.v += v; run.sc = score; run.mc = Math.max(run.mc, chainV); }
    session.v += v;
    se(chainStep >= 2 ? 'chain' : 'pop', chainStep);
    state = 'clearing'; timer = 20;
    return;
  }
  if (gravityStep(true)) { state = 'falling'; timer = 8; return; }
  chainBonus();
  settled();
}

function gravityStep(dry) {
  let moved = false;
  for (let y = H - 2; y >= 0; y--) {
    for (let x = 0; x < W; x++) {
      const c = grid[y][x];
      if (!c || c.t !== 'p' || c.l === 'L') continue;
      if (c.l === 'R') {
        if (!grid[y + 1][x] && !grid[y + 1][x + 1]) {
          moved = true;
          if (!dry) { grid[y + 1][x] = c; grid[y + 1][x + 1] = grid[y][x + 1]; grid[y][x] = null; grid[y][x + 1] = null; }
        }
      } else if (!grid[y + 1][x]) {
        moved = true;
        if (!dry) { grid[y + 1][x] = c; grid[y][x] = null; }
      }
    }
  }
  return moved;
}

function settled() {
  if (virusCount() === 0) {
    state = 'cleared';
    if (run) { run.st++; run.cl.push(level); run.lv = level; }
    session.st++; session.lv = Math.max(session.lv, level);
    const got = saveRun(false);
    bgmPlay('clear');
    showMsg('ステージクリア！', `レベル ${level} クリア<br>スコア ${score.toLocaleString()}`,
      [['つぎのレベルへ', () => { level = Math.min(level + 1, MAX_LEVEL); hideAll(); startLevel(); bgmPlay('play'); }, true]], true);
    announce(got);
    return;
  }
  throwNext();
}

// 残機：3機。積み上がってしまったら1機減って同じレベルをやり直し。0機でゲームオーバー
const LIVES = 3;
let lives = LIVES;
function topOut() {
  lives--;
  if (run) run.miss = (run.miss || 0) + 1;
  if (lives <= 0) { gameOver(); return; }
  state = 'miss'; bgmPlay('miss');
  flushRun();
  showMsg('ミス！', `のこり ${lives}機<br>レベル ${level} をもう一度`,
    [['リトライ', () => { hideAll(); startLevel(); bgmPlay('play'); }, true], ['あきらめる', () => { lives = 0; gameOver(); }]]);
}
function gameOver() {
  if (state !== 'over') bgmPlay('over');
  state = 'over';
  const got = saveRun(true);
  const best = bestScore();
  showMsg('ゲームオーバー',
    `スコア ${score.toLocaleString()}${score > 0 && score >= best ? '<br>ベスト更新！' : ''}<br>到達レベル ${level}`,
    [['もう一度', () => { hideAll(); newGame(); }, true], ['メニュー', toMenu], ['記録', () => openRecords('over')]]);
  announce(got);
}

function newGame() {
  score = 0; next = null; lives = LIVES;
  run = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(),
          sp: speedSel, lv0: level, lv: level, st: 0, cl: [], v: 0, sc: 0, mc: 0, pc: 0, dur: 0, end: false };
  runStartMs = performance.now();
  gameFrames = 0;
  session.g++;
  try { localStorage.setItem('drMasakiPrefs', JSON.stringify({ level, speed: speedSel })); } catch (e) {}
  startLevel();
  BGM.cur = null; bgmPlay('play');
}

/* ================= 毎フレームの更新 ================= */
// タイマー（1/60秒単位）。gameFrames は今のゲーム、appFrames は起動してからの連続プレイ。
// どちらも実際に遊んでいる間だけ進む。一時停止・メニュー・クリア画面・別アプリや通話で裏に回っている間は止まる
let appFrames = 0, gameFrames = 0, stageFrames = 0;
// ステージを始めてから1分ごとに、落ちる速さが10%ずつ上がる（1.1倍、1.21倍…）
const rushMult = () => Math.pow(1.1, Math.floor(stageFrames / 3600));
const fallNow = () => Math.max(1, FALL[speedIdx] / rushMult());
const GAME_STATES = ['play', 'throw', 'clearing', 'falling'];
const fmtClock = f => { const t = Math.floor(f / 60), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0'); };
function update() {
  frame++;
  if (run && GAME_STATES.includes(state)) {
    gameFrames++; appFrames++; stageFrames++;
    if (++idleFrames >= IDLE_LIMIT) breakSession();
    if (appFrames % 3600 === 0) { const before = unlockedSet(); saveSession(); announce(newlyUnlocked(before)); }
  }
  if (state === 'play') {
    while (queue.length) {
      const k = queue.shift();
      if (k === 'L') tryMove(-1, 0);
      else if (k === 'R') tryMove(1, 0);
      else if (k === 'ROT') rotateLeft();
    }
    for (const [key, dx] of [['ArrowLeft', -1], ['ArrowRight', 1]]) {
      if (held[key]) {
        holdT[key]++;
        if (holdT[key] >= 16 && (holdT[key] - 16) % 6 === 0) tryMove(dx, 0);
      }
    }
    if (held.ArrowDown) {
      holdT.ArrowDown++;
      if (holdT.ArrowDown % 2 === 0 && !tryMove(0, 1)) { lock(); return; }
      dropT = 0;
    } else if (++dropT >= fallNow()) {
      dropT = 0;
      if (!tryMove(0, 1)) lock();
    }
    return;
  }
  queue.length = 0;
  if (state === 'throw') {
    timer++;
    if (timer > 12) throwPose = 0;
    if (timer >= THROW) landThrow();
  } else if (state === 'clearing') {
    if (--timer <= 0) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x] && grid[y][x].t === 'x') grid[y][x] = null;
      if (gravityStep(true)) { state = 'falling'; timer = 8; } else resolve();
    }
  } else if (state === 'falling') {
    if (--timer <= 0) { if (gravityStep(false)) timer = 8; else resolve(); }
  }
}

/* ================= 描画 ================= */
function rr(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
}
function drawHalf(c, px, py, col, l, s = CS) {
  const k = COLORS[col], p = 2, r = s * 0.42;
  let x = px + p, y = py + p, w = s - 2 * p, h = s - 2 * p, rad = [r, r, r, r];
  if (l === 'R') { w += p; rad = [r, 0, 0, r]; }
  if (l === 'L') { x -= p; w += p; rad = [0, r, r, 0]; }
  if (l === 'U') { y -= p; h += p; rad = [0, 0, r, r]; }
  if (l === 'D') { h += p; rad = [r, r, 0, 0]; }
  const g = c.createLinearGradient(px, py, px + s, py + s);
  g.addColorStop(0, k.light); g.addColorStop(.35, k.main); g.addColorStop(1, k.dark);
  rr(c, x, y, w, h, rad); c.fillStyle = g; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = k.dark; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)';
  rr(c, px + s * .25, py + s * .2, s * .22, s * .14, s * .07); c.fill();
}
function drawCapsule(c, cx, cy, cols, ang, s = CS) {
  c.save(); c.translate(cx, cy); c.rotate(ang);
  drawHalf(c, -s, -s / 2, cols[0], 'R', s);
  drawHalf(c, 0, -s / 2, cols[1], 'L', s);
  c.restore();
}
function drawVirus(c, cx, cy, col, sc = 1, seed = 0, faded = false) {
  const k = COLORS[col];
  const t = frame / 12 + seed * .37, bob = Math.sin(t) * 1.2;
  c.save(); c.translate(cx, cy + bob * sc); c.scale(sc * CS / 30, sc * CS / 30);
  if (faded) c.globalAlpha = .18;
  c.fillStyle = k.main; c.strokeStyle = k.dark; c.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.sin(t) * .15;
    c.beginPath(); c.arc(Math.cos(a) * 10, Math.sin(a) * 10, 3, 0, Math.PI * 2); c.fill();
  }
  c.beginPath(); c.arc(0, 0, 9.5, 0, Math.PI * 2); c.fill(); c.stroke();
  const blink = (Math.floor(frame / 6) + seed * 7) % 40 === 0;
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-3.5, -1.5, 2.8, blink ? .6 : 3.4, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(3.5, -1.5, 2.8, blink ? .6 : 3.4, 0, 0, Math.PI * 2); c.fill();
  if (!blink) {
    c.fillStyle = '#111';
    c.beginPath(); c.arc(-3 + Math.sin(t) * .8, -1, 1.4, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(4 + Math.sin(t) * .8, -1, 1.4, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = '#111'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(0, 4, 2.5, .15 * Math.PI, .85 * Math.PI); c.stroke();
  c.restore();
}
function drawPop(c, px, py, col) {
  const k = COLORS[col], prog = 1 - timer / 20, cx = px + CS / 2, cy = py + CS / 2;
  c.save(); c.globalAlpha = Math.max(0, 1 - prog); c.strokeStyle = k.main; c.lineWidth = 3;
  c.beginPath(); c.arc(cx, cy, 4 + prog * 10, 0, Math.PI * 2); c.stroke();
  c.fillStyle = k.light;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    c.beginPath(); c.arc(cx + Math.cos(a) * prog * 12, cy + Math.sin(a) * prog * 12, 2.5, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

const docFor = lv => DOCS[lv >= 45 ? 3 : lv >= 35 ? 2 : lv >= 25 ? 1 : 0];
const DOC_H = 133, DOC_CX = 304, DOC_BOTTOM = 137;
function hand(pose) {
  const d = docFor(level), w = DOC_H * d.aspect;
  const x = DOC_CX - w / 2 + d.fx * w - 10, y = DOC_BOTTOM - DOC_H + d.fy * DOC_H + 6;
  return pose === 1 ? [x - 7, y - 12] : [x, y];
}
function drawDoctor(pose) {
  let d = docFor(level);
  if (!d.img.complete || !d.img.naturalWidth) d = DOCS[0];
  if (!d.img.complete || !d.img.naturalWidth) return;
  const h = DOC_H, w = h * d.aspect;
  const breathe = Math.sin(frame / 20);
  ctx.save();
  ctx.translate(DOC_CX, DOC_BOTTOM);
  if (pose === 1) { ctx.translate(0, -6); ctx.rotate(-0.08); }
  ctx.scale(1 + breathe * 0.008, 1 - breathe * 0.008);
  ctx.drawImage(d.img, -w / 2, -h, w, h);
  ctx.restore();
}

function drawBox(x, y, w, h, label, value, big = 20) {
  ctx.fillStyle = '#161a36'; ctx.strokeStyle = '#2d3366'; ctx.lineWidth = 1.5;
  rr(ctx, x, y, w, h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9da3d6'; ctx.font = '800 10px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(label, x + 8, y + 6);
  ctx.fillStyle = '#eef0ff'; ctx.font = '800 ' + big + 'px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText(value, x + w - 8, y + h - big - 5);
  ctx.textAlign = 'left';
}

const FONT = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif';
function drawBottle() {
  const x0 = BX - 6, y0 = BY - 6, w = W * CS + 12, h = H * CS + 12;
  const nx0 = BX + 3 * CS - 8, nw = 2 * CS + 16;
  ctx.fillStyle = '#080a18';
  rr(ctx, x0, y0, w, h, 14); ctx.fill();
  rr(ctx, nx0, y0 - 26, nw, 34, [8, 8, 0, 0]); ctx.fill();
  ctx.strokeStyle = '#4a5299'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(nx0, y0 - 26); ctx.lineTo(nx0, y0); ctx.lineTo(x0 + 14, y0);
  ctx.arcTo(x0, y0, x0, y0 + 14, 14); ctx.lineTo(x0, y0 + h - 14);
  ctx.arcTo(x0, y0 + h, x0 + 14, y0 + h, 14); ctx.lineTo(x0 + w - 14, y0 + h);
  ctx.arcTo(x0 + w, y0 + h, x0 + w, y0 + h - 14, 14); ctx.lineTo(x0 + w, y0 + 14);
  ctx.arcTo(x0 + w, y0, x0 + w - 14, y0, 14); ctx.lineTo(nx0 + nw, y0); ctx.lineTo(nx0 + nw, y0 - 26);
  ctx.stroke();
  ctx.strokeStyle = '#151935'; ctx.lineWidth = 1;
  for (let x = 1; x < W; x++) { ctx.beginPath(); ctx.moveTo(BX + x * CS + .5, BY); ctx.lineTo(BX + x * CS + .5, BY + H * CS); ctx.stroke(); }
  for (let y = 1; y < H; y++) { ctx.beginPath(); ctx.moveTo(BX, BY + y * CS + .5); ctx.lineTo(BX + W * CS, BY + y * CS + .5); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.05)'; rr(ctx, x0 + 6, y0 + 10, 8, h - 20, 4); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, LW, LH);
  const bg = ctx.createLinearGradient(0, 0, 0, LH);
  bg.addColorStop(0, '#1a1f48'); bg.addColorStop(1, '#0c0e1e');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, LW, LH);

  ctx.fillStyle = '#7cf2c8'; ctx.font = '800 24px ' + FONT; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Dr.MASAKI', 14, 30);
  // タイマー表示（ロゴの右）
  ctx.font = '800 10px ' + FONT; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'right';
  ctx.fillStyle = '#9da3d6'; ctx.fillText('ゲーム', 190, 17); ctx.fillText('連続', 190, 32);
  ctx.font = '800 13px ' + FONT; ctx.fillStyle = '#eef0ff';
  ctx.fillText(run ? fmtClock(gameFrames) : '--:--', 244, 17);
  ctx.fillStyle = appFrames >= 60 * 60 * 60 ? '#ff8fa3' : '#eef0ff';
  ctx.fillText(fmtClock(appFrames), 244, 32);
  ctx.textAlign = 'left';
  drawBox(14, 40, 112, 46, 'SCORE', score.toLocaleString(), 18);
  drawBox(132, 40, 112, 46, 'TOP', Math.max(bestScore(), score).toLocaleString(), 18);

  drawBottle();
  if (grid) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = grid[y][x]; if (!c) continue;
      const px = BX + x * CS, py = BY + y * CS;
      if (c.t === 'v') drawVirus(ctx, px + CS / 2, py + CS / 2, c.c, 1, x * 3 + y);
      else if (c.t === 'p') drawHalf(ctx, px, py, c.c, c.l);
      else drawPop(ctx, px, py, c.c);
    }
    if (cur && state !== 'throw') {
      const [a, b] = cellsOf(cur);
      const la = cur.o === 'h' ? 'R' : 'U', lb = cur.o === 'h' ? 'L' : 'D';
      if (a[1] >= 0) drawHalf(ctx, BX + a[0] * CS, BY + a[1] * CS, a[2], la);
      if (b[1] >= 0) drawHalf(ctx, BX + b[0] * CS, BY + b[1] * CS, b[2], lb);
    }
  }

  drawDoctor(state === 'throw' ? throwPose : 0);
  const pose = state === 'throw' ? throwPose : 0;
  if (state === 'throw' && flying) {
    const t = Math.min(timer / THROW, 1);
    const [sx, sy] = hand(1);
    const x = sx + (SPAWN_C[0] - sx) * t;
    const y = sy + (SPAWN_C[1] - sy) * t - Math.sin(Math.PI * t) * 58;
    const ang = -Math.floor(t * 8) * Math.PI / 2;
    drawCapsule(ctx, x, y, flying, t >= 1 ? 0 : ang, CS * (0.75 + 0.25 * t));
  } else if (next) {
    const [hx, hy] = hand(pose);
    drawCapsule(ctx, hx, hy - 10, next, 0, CS * 0.75);
  }

  const vleft = grid ? virusCount() : 0;
  drawBox(256, 166, 96, 46, 'LEVEL', String(level));
  const rm = rushMult();
  drawBox(256, 218, 96, 46, rm > 1 ? 'SPEED ×' + rm.toFixed(2) : 'SPEED', SPEED_NAMES[speedSel]);
  drawBox(256, 270, 96, 46, 'VIRUS', String(vleft));
  drawBox(256, 322, 96, 46, 'LIFE', String(lives));
  if (!showLens) return;
  ctx.fillStyle = '#161a36'; ctx.strokeStyle = '#2d3366'; ctx.lineWidth = 1.5;
  rr(ctx, 256, 422, 96, 112, 48); ctx.fill(); ctx.stroke();
  const spots = [[284, 456], [324, 456], [304, 498]];
  for (let i = 0; i < 3; i++) {
    const left = grid ? virusCount(i) : 1;
    const dance = state === 'play' || state === 'throw' ? Math.sin(frame / 8 + i * 2) * 3 : 0;
    drawVirus(ctx, spots[i][0] + dance, spots[i][1], i, 1.25, i * 5, left === 0);
  }
}

/* ================= 画面サイズ ================= */
let scale = 1;
const PAD_H = 206; let showLens = true;
function padShown() { return padMode === 'on' || (padMode === 'auto' && touchMode); }
function fit() {
  const sh = $('shell');
  // 画面ボタンを出すときは、その分（ゲームの単位で PAD_H）を下にあけて、ボタンが瓶やウイルスに重ならないようにする
  // 横は画面いっぱい（スマホ）。縦に余った分はゲーム画面をのばして使い、
  // 画面ボタンを出すときは、ます（CS）を小さくして瓶の下に十字キーの場所をつくる
  const vw = sh.clientWidth, vh = sh.clientHeight;
  scale = Math.max(0.3, Math.min(vw / LW, vh / 600));
  const pu = Math.min(scale, 1.25); document.documentElement.style.setProperty('--pu', pu + 'px');
  LH = Math.max(600, Math.floor(vh / scale));
  const padW = padShown() ? (PAD_H * pu - padShift) / scale : 0;
  CS = Math.max(14, Math.min(28, Math.floor((LH - padW - BY - 14) / H)));
  BX = Math.round((246 - W * CS) / 2);
  SPAWN_C[0] = BX + 4 * CS; SPAWN_C[1] = BY + CS / 2;
  showLens = !padShown() || 536 <= LH - (100 * pu - padShift) / scale;
  world.style.height = LH + 'px';
  stage.style.width = LW * scale + 'px'; stage.style.height = LH * scale + 'px';
  world.style.transform = `scale(${scale})`;
  document.documentElement.style.setProperty('--s', String(scale));
  placePad();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(LW * scale * dpr); cv.height = Math.round(LH * scale * dpr);
  ctx.setTransform(cv.width / LW, 0, 0, cv.height / LH, 0, 0);
}
addEventListener('resize', fit);
// 操作パネルの高さを「実際に見えている画面の高さ」に合わせる。
// ホーム画面から起動したiPhoneでは、画面の下端より上で止まることがあるので画面全体の高さを使う
function placePad() {
  const pad = $('pad');
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

async function initStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
    const snap = await Promise.race([db.collection('data/users/' + id).get(), timeout]);
    store = db; uid = id; cloudState = 'cloud';
    const byId = new Map();
    for (const d of snap.docs) for (const r of ((d.data() || {}).runs || [])) byId.set(r.id, r);
    const sDoc = snap.docs.find(d => d.id === 'sessions');
    const sById = new Map(((sDoc && sDoc.data() || {}).list || []).map(x => [x.id, x]));
    let sDirty = false;
    for (const x of sessions) { const c = sById.get(x.id); if (!c || x.dur > c.dur) { sById.set(x.id, x); sDirty = true; } }
    sessions = [...sById.values()].sort((a, b) => a.t - b.t); trimSessions();
    try { localStorage.setItem('drMasakiSessions', JSON.stringify(sessions)); } catch (e) {}
    const dirty = new Set();
    for (const r of runs) {
      const c = byId.get(r.id);
      if (!c || (r.dur || 0) > (c.dur || 0)) { byId.set(r.id, r); dirty.add(partKey(r.t)); }
    }
    runs = [...byId.values()].sort((a, b) => a.t - b.t);
    saveLocal();
    dirty.forEach(queuePart);
    if (sDirty) queueSessions();
    if (!$('rec').hidden) renderRecords();
    if (!$('menu').hidden) renderTopRec();
  } catch (e) { cloudState = 'error'; }
}

  const cur = { ...session, dur: Math.floor(appFrames / 60), now: true };
  const allS = sessions.filter(x => x.id !== session.id).concat(cur.dur >= 60 ? [cur] : []);
  const top5 = allS.sort((a, b) => b.dur - a.dur).slice(0, 5);
  const topSessions = top5.length
    ? `<div class="hist">${top5.map((x, i) => `<span>${i + 1}位 ${fmtDate(x.t)}</span><span>${x.g}ゲーム</span><span>Lv${x.lv}まで</span><span>${fmtClock(x.dur * 60)}${x.now ? '（今回）' : ''}</span>`).join('')}</div>`
    : '<p>1分以上続けて遊ぶと、ここに残ります。</p>';
  const cloudMsg = cloudState === 'cloud' ? '記録はあなたのアカウントに保存されています（スマホとPCで共通）'
    : cloudState === 'error' ? 'アカウントへの保存に失敗しました。この端末には残っています'
    : 'この端末にだけ保存されています';
  $('rec').innerHTML = `
    <h2>記録</h2>
    <div class="grid4">
      <div class="stat"><span class="lbl">ベスト</span><b>${Math.max(...s.best).toLocaleString()}</b></div>
      <div class="stat"><span class="lbl">ゲーム数</span><b>${s.games.toLocaleString()}</b></div>
      <div class="stat"><span class="lbl">退治したウイルス</span><b>${s.v.toLocaleString()}</b></div>
      <div class="stat"><span class="lbl">クリアしたステージ</span><b>${s.st.toLocaleString()}</b></div>
      <div class="stat"><span class="lbl">合計スコア</span><b>${s.score.toLocaleString()}</b></div>
      <div class="stat"><span class="lbl">プレイ時間</span><b>${fmtTime(s.time)}</b></div>
      <div class="stat"><span class="lbl">一度に消した最多</span><b>${s.mc}匹</b></div>
      <div class="stat"><span class="lbl">実績</span><b>${un.size} / ${ACH.length}</b></div>
    </div>
    <div class="sec">連続プレイ（耐久）</div>
    <div class="grid4">
      <div class="stat"><span class="lbl">最長</span><b>${fmtClock(s.longest * 60)}</b></div>
      <div class="stat"><span class="lbl">今回</span><b>${fmtClock(appFrames)}</b></div>
    </div>
    ${topSessions}
    <div class="sec">スピード別ベスト</div>
    <table><tr><th>LOW</th><th>MED</th><th>HI</th></tr>
      <tr>${s.best.map(b => `<td>${b.toLocaleString()}</td>`).join('')}</tr></table>
    <div class="sec">クリアしたレベル</div>
    <table><tr><th>Lv</th><th>LOW</th><th>MED</th><th>HI</th></tr>${lvRows}</table>
    <div class="sec">実績</div>
    <div>${ACH.map(a => `<div class="ach ${un.has(a.id) ? '' : 'lock'}"><span class="m">${un.has(a.id) ? '★' : '☆'}</span><div>${esc(a.n)}<small>${esc(a.d)}</small></div></div>`).join('')}</div>
    <div class="sec">最近のゲーム</div>
    ${recent.length ? `<div class="hist">${hist}</div>` : '<p>まだ記録がありません。1ゲーム遊ぶとここに残ります。</p>'}
    <div class="cloud">${cloudMsg}</div>
    <div class="recfoot"><button class="big" id="recBack">もどる</button></div>`;
  $('recBack').addEventListener('click', () => {
    if (recFrom === 'over') gameOver(); else toMenu();
  });
}

/* ================= 起動 ================= */
document.body.appendChild($('pad'));
// ホスティング側が後から差し込むiframe（「Powered by Netlify」など）を取り除く
const dropInjected = () => document.querySelectorAll('iframe').forEach(f => f.remove());
new MutationObserver(dropInjected).observe(document.documentElement, { childList: true, subtree: true });
dropInjected();
if (window.visualViewport) visualViewport.addEventListener('resize', placePad);
grid = emptyGrid();
fit();
updatePad();
requestAnimationFrame(loop);
renderTopRec();
initStore();
/* ================= BGM・効果音（オリジナル曲。音のファイルは使わず、ブラウザがその場で演奏する） =================
   曲は「音名:長さ」（長さは16分音符いくつ分、省略で2）、r は休み、ドラムは k/s/h。
   プレイ中の曲は「ノリノリ」「まったり」から選べる。ジングルは1回鳴らしたら次の曲へ */
const SONGS = {
  title: { bpm: 132, lead: 'E5 G5 A5 G5 E5 C5 D5:4 E5 D5 C5 A4 G4:6 r G4 A4 C5 D5 E5 G5 A5:4 G5 E5 D5 E5 C5:6 r',
    bass: 'C3:4 G3:4 C3:4 G3:4 A2:4 E3:4 A2:4 E3:4 F2:4 C3:4 F2:4 C3:4 G2:4 D3:4 C3:8', drum: 'k:4 s:4 k:4 s:4' },
  play1: { bpm: 150, lead: 'D5 r D5 F5 r A5 G5 F5 E5:4 C5 C5 D5:6 r D5 r D5 F5 r A5 C6 A5 G5:4 F5 E5 F5:6 r A#4 D5 F5 A#5:4 A5 G5 F5 C5 E5 G5 C6:4 A#5 A5 G5 A5 G5 F5 E5 D5 E5 F5 A5 D5:4 A4:4 D5:4 r:4',
    bass: 'D2 D3 r D3 D2 D3 r D3 C3 C4 r C4 C3 C4 r C4 D2 D3 r D3 D2 D3 r D3 C3 C4 r C4 C3 C4 r C4 A#2 A#3 r A#3 A#2 A#3 r A#3 C3 C4 r C4 C3 C4 r C4 A2 A3 r A3 A2 A3 r A3 D2 D3 r D3 D2:4 r:4',
    drum: 'k h s h k k s h' },
  play2: { bpm: 104, soft: true, lead: 'A4:3 C5:1 F5:4 E5 C5 A4:4 G4:3 A#4:1 D5:4 C5:8 A4:3 C5:1 F5:4 G5 A5 G5:4 F5 E5 D5 E5 F5:8 D5:3 F5:1 A#5:4 A5 G5 F5:4 C5:3 E5:1 G5:4 F5 E5 C5:4 D5 C5 A#4 A4 G4:4 C5:4 F4:12 r:4',
    bass: 'F2:8 C3:8 A#2:8 C3:8 F2:8 A2:8 A#2:8 F2:8 A#2:8 D3:8 C3:8 G2:8 G2:8 C3:8 F2:16', drum: 'k:4 h:4 h:4 h:4' },
  clear: { bpm: 150, once: true, lead: 'C5:1 E5:1 G5:1 C6:1 r G5 C6:8', bass: 'C3:4 E3:4 G3 C3:6', drum: 's:1 s:1 s:1 s:1 r k:8 r' },
  miss: { bpm: 140, once: true, soft: true, lead: 'G4 F#4 F4 E4:8', bass: 'C3:6 B2:8' },
  over: { bpm: 120, once: true, soft: true, lead: 'C5:3 G4:1 E4:3 G4:1 F4 E4 D4 C4:10', bass: 'C3:8 G2:8 C2:8' }
};
const NOTE_I = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function parseTrack(str) {
  return str.trim().split(/\s+/).map(t => {
    const [n, l] = t.split(':'); const len = +(l || 2);
    if (n === 'r') return { f: 0, len };
    if (/^[ksh]$/.test(n)) return { d: n, len };
    const m = /^([A-G]#?)(\d)$/.exec(n); return { f: 440 * Math.pow(2, (NOTE_I[m[1]] + 12 * (+m[2] + 1) - 69) / 12), len };
  });
}
Object.values(SONGS).forEach(s => ['lead', 'bass', 'drum'].forEach(k => { if (s[k]) s[k] = parseTrack(s[k]); }));
const AUDIO_KEY = 'drMasakiAudio';
const BGM = { ctx: null, sel: 1, se: true, cur: null, next: null, timer: null, ch: [], vol: null, noise: null };
try { const a = JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}'); if (a.sel != null) BGM.sel = a.sel; if (a.se != null) BGM.se = a.se; } catch (e) {}
function audioSave() { try { localStorage.setItem(AUDIO_KEY, JSON.stringify({ sel: BGM.sel, se: BGM.se })); } catch (e) {} }
function bgmCtx() {
  if (BGM.ctx) return BGM.ctx; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  const c = new AC(); BGM.ctx = c;
  const nb = c.createBuffer(1, c.sampleRate * 0.3, c.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; BGM.noise = nb;
  return c;
}
// 曲ごとに音量つまみを作る。曲を変えると前の曲の残りの音は小さくなって消える
function bgmFade() { const o = BGM.vol, c = BGM.ctx; if (!o || !c) return; const t = c.currentTime; o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value, t); o.gain.linearRampToValueAtTime(0, t + 0.08); setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 400); BGM.vol = null; }
function bgmFresh(c) { bgmFade(); BGM.vol = c.createGain(); BGM.vol.gain.value = 0.15; BGM.vol.connect(c.destination); }
function bgmNote(kind, ev, t, dur, soft) {
  const c = BGM.ctx; if (!BGM.vol) return; const g = c.createGain(); g.connect(BGM.vol);
  if (ev.d) {
    const src = c.createBufferSource(); src.buffer = BGM.noise; const f = c.createBiquadFilter();
    const v = (soft ? 0.5 : 1) * (ev.d === 'k' ? 0.9 : ev.d === 's' ? 0.5 : 0.16), len = ev.d === 'k' ? 0.09 : ev.d === 's' ? 0.12 : 0.04;
    f.type = ev.d === 'k' ? 'lowpass' : ev.d === 's' ? 'bandpass' : 'highpass'; f.frequency.value = ev.d === 'k' ? 160 : ev.d === 's' ? 1800 : 7000;
    src.connect(f); f.connect(g); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + len); src.start(t); src.stop(t + len + 0.02); return;
  }
  if (!ev.f) return;
  const o = c.createOscillator(); o.type = kind === 'lead' ? (soft ? 'triangle' : 'square') : 'triangle'; o.frequency.value = ev.f; o.connect(g);
  const v = kind === 'lead' ? (soft ? 0.5 : 0.28) : 0.55, end = t + Math.max(0.05, dur * 0.9);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.setValueAtTime(v * 0.75, t + Math.min(0.08, dur * 0.4)); g.gain.linearRampToValueAtTime(0.0001, end);
  o.start(t); o.stop(end + 0.02);
}
function bgmTick() {
  const c = BGM.ctx, s = SONGS[BGM.cur]; if (!c || !s) return; const step = 60 / s.bpm / 4, ahead = c.currentTime + 0.25; let allDone = true;
  BGM.ch.forEach(ch => {
    while (!ch.done && ch.t < ahead) { const ev = ch.tr[ch.i]; bgmNote(ch.k, ev, ch.t, ev.len * step, s.soft); ch.t += ev.len * step; ch.i++; if (ch.i >= ch.tr.length) { if (s.once) ch.done = true; else ch.i = 0; } }
    if (!ch.done || ch.t > c.currentTime) allDone = false;
  });
  if (s.once && allDone) { const n = BGM.next; BGM.next = null; BGM.cur = null; if (n) bgmPlay(n); }
}
// 場面の曲："title" "play"（選んだ曲）"clear" "miss" "over"
function bgmPlay(name, after) {
  if (name === 'play') name = BGM.sel === 2 ? 'play2' : 'play1';
  const s = SONGS[name]; if (!s) return;
  if (s.once) BGM.next = after || null;
  else if (BGM.cur && SONGS[BGM.cur].once) { BGM.next = name; return; }
  else if (BGM.cur === name) return;
  if (!BGM.sel) { BGM.cur = s.once ? null : name; return; }
  const c = bgmCtx(); if (!c) return; if (c.state === 'suspended') c.resume().catch(() => {});
  bgmFresh(c); BGM.cur = name; const t0 = c.currentTime + 0.06;
  BGM.ch = ['lead', 'bass', 'drum'].filter(k => s[k]).map(k => ({ k, tr: s[k], i: 0, t: t0, done: false }));
  if (!BGM.timer) BGM.timer = setInterval(bgmTick, 40); bgmTick();
}
function bgmStop() { BGM.cur = null; BGM.next = null; BGM.ch = []; bgmFade(); }
function bgmScene() { return state === 'title' ? 'title' : ['play', 'throw', 'clearing', 'falling'].includes(state) ? 'play' : null; }
// 効果音：消したとき「ポッ」、連鎖したら「ピロン♪」が連鎖ごとに高くなる
function se(kind, n) {
  if (!BGM.se) return; const c = bgmCtx(); if (!c) return; if (c.state === 'suspended') c.resume().catch(() => {});
  const out = c.createGain(); out.gain.value = 0.22; out.connect(c.destination); const t = c.currentTime + 0.01;
  const tone = (f, at, len, type, v) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; o.connect(g); g.connect(out); g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(0.001, at + len); o.start(at); o.stop(at + len + 0.02); };
  if (kind === 'pop') { const o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(1400, t + 0.06); o.connect(g); g.connect(out); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.start(t); o.stop(t + 0.1); }
  if (kind === 'chain') { const b = 660 * Math.pow(2, Math.min(n - 2, 8) * 2 / 12); tone(b, t, 0.1, 'square', 0.3); tone(b * 1.5, t + 0.07, 0.22, 'square', 0.3); tone(b * 2, t + 0.07, 0.22, 'triangle', 0.25); }
}
function setBgmSel(v) {
  BGM.sel = v; if (v) BGM.last = v; audioSave();
  const mbtn = $('musicBtn'); if (mbtn) { mbtn.classList.toggle('off', !v); mbtn.setAttribute('aria-label', v ? '音楽をオフにする' : '音楽をオンにする'); }
  document.querySelectorAll('#bgmSel button').forEach(x => x.classList.toggle('sel', +x.dataset.b === v));
  if (!v) bgmStop(); else { const sc = bgmScene(); if (sc) { if (sc === 'play') BGM.cur = null; bgmPlay(sc === 'title' ? 'title' : 'play'); } else if (state === 'title') bgmPlay('title'); }
}
function setSe(on) { BGM.se = on; audioSave(); document.querySelectorAll('#seSel button').forEach(x => x.classList.toggle('sel', (x.dataset.v === '1') === on)); }
document.querySelectorAll('#bgmSel button').forEach(b => b.addEventListener('click', () => { setBgmSel(+b.dataset.b); if (state === 'title' && BGM.sel) { BGM.cur = null; bgmPlay('title'); } }));
document.querySelectorAll('#seSel button').forEach(b => b.addEventListener('click', () => { setSe(b.dataset.v === '1'); if (BGM.se) se('chain', 2); }));
setBgmSel(BGM.sel); setSe(BGM.se);
// スマホは画面をさわるまで音が出せないので、最初のタッチで鳴らしはじめる
function bgmWake() { if (!BGM.sel && !BGM.se) return; const c = bgmCtx(); if (!c) return; if (c.state !== 'running') c.resume().catch(() => {}); if (BGM.sel && !BGM.cur) { const sc = bgmScene(); if (sc) bgmPlay(sc); } }
['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, bgmWake, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!BGM.ctx) return; if (document.hidden) BGM.ctx.suspend().catch(() => {}); else BGM.ctx.resume().catch(() => {}); });
})();
</script>
